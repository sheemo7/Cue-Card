<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d1a17" />
      <stop offset="100%" stop-color="#121110" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ab69" />
      <stop offset="50%" stop-color="#c58b4a" />
      <stop offset="100%" stop-color="#9a6a33" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#322d28" stroke-width="8"/>
  
  <!-- Outer Sound Pulse Wave -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#c58b4a" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#gold-grad)" stroke-width="6" stroke-opacity="0.6"/>

  <!-- In-Ear / Sound Wave Core Shape -->
  <path d="M 216 160 C 290 160, 340 205, 340 260 C 340 310, 305 344, 260 348 C 248 349, 238 340, 238 328 C 238 316, 248 308, 258 306 C 285 302, 304 282, 304 256 C 304 220, 268 194, 216 194 C 182 194, 156 210, 156 236 C 156 250, 166 260, 180 260 C 194 260, 204 250, 204 236" 
        fill="none" stroke="url(#gold-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Audio Monitor Earpiece Dot -->
  <circle cx="216" cy="256" r="22" fill="url(#gold-grad)" />
  <circle cx="216" cy="256" r="10" fill="#121110" />

  <!-- Play Cue Indicator Triangle -->
  <polygon points="360,244 384,256 360,268" fill="#e2ab69"/>
